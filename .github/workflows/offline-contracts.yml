name: Mirage offline contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal offline test dependency
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compile Python sources
        run: python -m compileall -q mirage mirage_main.py
      - name: Offline unit tests (no capture, no network target)
        run: python -m unittest discover -s tests -v
